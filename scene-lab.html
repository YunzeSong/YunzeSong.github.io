<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e3d7">
  <meta name="description" content="北京主页场景的天气、云、水纹与单只喜鹊互动实验。">
  <title>Beijing Weather Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/logo-matcha-basque.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./scene-lab.css">
  <script defer src="./scene-engine.js"></script>
</head>
<body>
  <main class="scene-lab">
    <a class="lab-back" href="./index.html">← 返回主页</a>

    <header class="lab-heading">
      <p class="lab-kicker">BEIJING / WEATHER STUDY 02</p>
      <h1>一座城，六种天气</h1>
      <p>建筑构图保持不变，仅改变云量、色温、能见度、降水和水面反馈。喜鹊会根据天气决定是否出现，水纹互动仍只在护城河内生效。</p>
    </header>

    <figure class="lab-player" data-scene-lab>
      <div class="lab-player-bar" aria-hidden="true">
        <span class="bar-lights"><i></i><i></i><i></i></span>
        <span data-scene-status>WEATHER PREVIEW · SUMMER / NOON / CLEAR</span>
      </div>

      <div
        class="lab-scene"
        data-scene-surface
        tabindex="0"
        aria-label="北京像素场景互动预览。可在水面移动或点击产生波纹，并用指针影响偶尔飞过的喜鹊。">
        <div class="lab-scene-world" data-scene-world>
          <img
            data-scene-image
            alt="无人物的北京像素景观：近景宫殿屋檐、故宫角楼、护城河与远处中央商务区"
            width="1672"
            height="941"
            decoding="async"
            fetchpriority="high">
          <canvas class="lab-motion" data-scene-canvas aria-hidden="true"></canvas>
        </div>
      </div>

      <figcaption>
        <span>天气与互动共用低分辨率 Canvas · 桌面 30fps / 移动端 24fps</span>
        <span>雷电无声音且限制亮度 · 系统减弱动态时停止全部运动</span>
      </figcaption>
    </figure>

    <nav class="weather-debug" aria-label="天气模拟快捷入口">
      <span>验收状态</span>
      <a data-weather-link="clear" href="?weather=clear&amp;season=summer">晴</a>
      <a data-weather-link="cloudy" href="?weather=cloudy&amp;intensity=.72&amp;season=autumn">云</a>
      <a data-weather-link="rain" href="?weather=rain&amp;intensity=.68&amp;season=summer">雨</a>
      <a data-weather-link="snow" href="?weather=snow&amp;intensity=.72&amp;season=winter&amp;temperature=-6">雪</a>
      <a data-weather-link="storm" href="?weather=storm&amp;intensity=.82&amp;season=summer&amp;lightning=1">雷暴</a>
      <a data-weather-link="wind" href="?weather=wind&amp;intensity=.72&amp;season=autumn&amp;wind=1.7">大风</a>
    </nav>

    <p class="lab-note">此页面用于人工覆盖季节、天气和光照状态；主页默认使用访客所在地的太阳周期与实时天气。</p>
  </main>
</body>
</html>
