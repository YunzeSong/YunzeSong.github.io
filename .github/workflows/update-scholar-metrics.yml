name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch citation counts
        run: node scripts/update-scholar-metrics.mjs
      - name: Commit changed counts
        shell: bash
        run: |
          if git diff --quiet -- assets/scholar-metrics.json; then
            echo "Citation counts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scholar-metrics.json
          git commit -m "chore: update Google Scholar citations"
          git push
